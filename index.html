<body>
<header><b>▣ MLPipe Studio</b><small>the leakage-safe language for ML pipelines · .mlp</small>
<button class="ghost" id="theme">Theme</button><button class="run" id="run">▶ Build &amp; Run&nbsp; Ctrl+Enter</button></header>
<main>
<aside><h4>EXPLORER</h4><div id="files"></div><br><h4>LANGUAGE</h4>
<ul class="lang"><li>Leakage = compile error</li><li>for-loops (unrolled)</li><li>require = quality gates</li><li>Typed columns</li><li>Compiles to scikit-learn</li></ul></aside>
<div class="work">
<div class="tab1"><span id="fname">churn.mlp</span></div>
<div class="ed"><div id="gut" class="mono"></div><textarea id="ta" spellcheck="false"></textarea></div>

</div></main>

<script>
/* ============ SAMPLE PROGRAMS ============ */
const SAMPLES={
"churn.mlp":`# Customer churn: a valid, leakage-safe pipeline
pipeline churn {
  data "customers.csv" {
    id      customer_id : numeric
    feature age         : numeric
    feature tenure      : numeric
    feature charges     : numeric
    feature plan        : categorical
    target  churned     : binary
  }

  require rows > 100
  require missing(age) < 0.2

  split 0.8 0.2 seed 42

  for c in [age, tenure, charges] {
    impute c median
    scale c standard
  }
  encode plan onehot

  model rf = random_forest(n_estimators=200, max_depth=8)
  train rf
  evaluate accuracy, f1, auc
}
`,
"compare_models.mlp":`# Train and compare several models on the same split
pipeline compare {
  data "houses.csv" {
    feature area  : numeric
    feature rooms : numeric
    feature city  : categorical
    target  price : numeric
  }
  split 0.7 0.3 seed 7
  for c in [area, rooms] { scale c minmax }
  encode city onehot

  model lin = linear_regression()
  model gb  = gradient_boosting(n_estimators=150)
  model knn5 = knn(n_neighbors=5)
  train lin
  train gb
  train knn5
  evaluate rmse, mae, r2
}
`,
"leakage_error.mlp":`# Compile-time leakage detection
pipeline leaky {
  data "customers.csv" {
    feature age    : numeric
    target  churned : binary
  }
  scale age standard
  split 0.8 0.2
  scale churned standard
  model m = logistic_regression()
  train m
  evaluate accuracy
}
`,
"type_errors.mlp":`# Static type / semantic checking
pipeline typed {
  data "customers.csv" {
    feature age  : numeric
    feature plan : categorical
    target  churned : binary
  }
  split 0.8 0.3
  scale plan standard
  encode age onehot
  scale salary standard
  model m = linear_regression()
  train m
  evaluate rmse
}
`,
"syntax_error.mlp":`# Syntax error: missing '=' in model declaration
pipeline broken {
  data "x.csv" {
    feature a : numeric
    target  y : binary
  }
  split 0.8 0.2
  model m logistic_regression()
}
`};

/* ============ LEXER ============ */
const KW=new Set("pipeline data feature target id split seed require scale encode impute for in model train evaluate".split(" "));
const E=(kind,msg,l,c)=>({kind,msg,l,c});
function lex(src){const t=[];let i=0,l=1,c=1;
 const adv=n=>{for(let k=0;k<n;k++){if(src[i]=="\n"){l++;c=1}else c++;i++}};
 while(i<src.length){const ch=src[i];if(/\s/.test(ch)){adv(1);continue}
  if(ch=="#"){while(i<src.length&&src[i]!="\n")adv(1);continue}
  const s={l,c},r=src.slice(i);let m;
  if(m=/^"[^"\n]*"/.exec(r)){t.push({k:"STR",v:m[0].slice(1,-1),...s});adv(m[0].length)}
  else if(ch=='"')throw E("Lexical","Unterminated string",l,c);
  else if(m=/^\d+(\.\d+)?/.exec(r)){t.push({k:"NUM",v:+m[0],...s});adv(m[0].length)}
  else if(m=/^[A-Za-z_]\w*/.exec(r)){t.push({k:KW.has(m[0])?"KW":"ID",v:m[0],...s});adv(m[0].length)}
  else if(m=/^(<=|>=|==|[<>])/.exec(r)){t.push({k:"OP",v:m[0],...s});adv(m[0].length)}
  else if("{}()[],:=".includes(ch)){t.push({k:"SYM",v:ch,...s});adv(1)}
  else throw E("Lexical",`Unexpected character '${ch}'`,l,c)}
 t.push({k:"EOF",v:"end of file",l,c});return t}

/* ============ PARSER (recursive descent) ============ */
function parse(t){let p=0;const pk=()=>t[p],nx=()=>t[p++];
 const bad=w=>{const x=pk();throw E("Syntax",`Expected ${w} (found ${x.k=="EOF"?"end of file":"'"+x.v+"'"})`,x.l,x.c)};
 const is=v=>pk().v===v&&pk().k!="STR"&&pk().k!="NUM";
 const eat=v=>is(v)?nx():bad("'"+v+"'");
 const id=()=>pk().k=="ID"?nx():bad("identifier");
 const num=()=>pk().k=="NUM"?nx():bad("number");
 const ref=()=>{const x=id();return{v:x.v,l:x.l,c:x.c}};
 const list=()=>{const a=[ref()];while(is(",")){nx();a.push(ref())}return a};
 function stmt(){const x=pk();if(x.k!="KW")bad("a statement");nx();const o={type:x.v,l:x.l,c:x.c};
  switch(x.v){
  case "data":o.path=pk().k=="STR"?nx().v:bad("string path");eat("{");o.cols=[];
   while(!is("}")){const r=pk();if(!["feature","target","id"].includes(r.v))bad("'feature', 'target' or 'id'");nx();
    const n=id();eat(":");const ty=id();o.cols.push({role:r.v,name:n.v,ty:ty.v,l:n.l,c:n.c,tl:ty.l,tc:ty.c})}
   eat("}");break;
  case "split":o.train=num().v;o.test=num().v;if(is("seed")){nx();o.seed=num().v}break;
  case "require":{const a=id();o.what=a.v;if(a.v=="missing"){eat("(");o.col=ref();eat(")")}
   o.op=pk().k=="OP"?nx().v:bad("comparison operator");o.val=num().v;break}
  case "scale":case "encode":case "impute":o.col=ref();o.method=ref();break;
  case "for":o.v=id().v;eat("in");eat("[");o.items=list();eat("]");eat("{");o.body=[];
   while(!is("}")){if(pk().k=="EOF")bad("'}'");o.body.push(stmt())}eat("}");break;
  case "model":o.name=id().v;eat("=");o.algo=ref();eat("(");o.args=[];
   while(!is(")")){const k=id().v;eat("=");const v=pk();if(!["NUM","STR","ID"].includes(v.k))bad("argument value");nx();o.args.push({k,v:v.v,t:v.k});if(is(","))nx()}
   eat(")");break;
  case "train":o.model=ref();break;
  case "evaluate":o.metrics=list();break;
  default:bad("a statement")}
  return o}
 eat("pipeline");const name=id().v;eat("{");const body=[];
 while(!is("}")){if(pk().k=="EOF")bad("'}'");body.push(stmt())}
 eat("}");if(pk().k!="EOF")bad("end of file");
 return{type:"pipeline",name,body}}

/* ============ SEMANTIC ANALYSIS + LEAKAGE CHECK ============ */
const ALG={logistic_regression:{classification:["LogisticRegression","linear_model"]},linear_regression:{regression:["LinearRegression","linear_model"]},
random_forest:{classification:["RandomForestClassifier","ensemble"],regression:["RandomForestRegressor","ensemble"]},
gradient_boosting:{classification:["GradientBoostingClassifier","ensemble"],regression:["GradientBoostingRegressor","ensemble"]},
decision_tree:{classification:["DecisionTreeClassifier","tree"],regression:["DecisionTreeRegressor","tree"]},
knn:{classification:["KNeighborsClassifier","neighbors"],regression:["KNeighborsRegressor","neighbors"]}};
const METRICS={classification:["accuracy","f1","precision","recall","auc"],regression:["rmse","mae","r2"]};
function sub(n,v,it){const o=JSON.parse(JSON.stringify(n));(function w(x){if(x&&typeof x=="object"){
  if(x.col&&x.col.v===v)x.col={...it};if(x.model&&x.model.v===v)x.model={...it};
  for(const k in x)w(x[k])}})(o);return o}
let unrolled=0;
function unroll(list){const out=[];for(const s of list){if(s.type=="for")for(const it of s.items){unrolled++;out.push(...unroll(s.body.map(b=>sub(b,s.v,it))))}else out.push(s)}return out}
function analyze(ast){const errs=[],warns=[];const e=(k,m,n)=>errs.push({kind:k,msg:m,l:n.l,c:n.c});
 unrolled=0;const flat=unroll(ast.body);
 let data=null,tgt=null,task=null,sp=null;const C={},M={},tr=[],tf=[],gates=[],ev=[];
 const need=(r,s)=>{if(!data){e("Semantic","declare a data block first",s);return null}const c=C[r.v];if(!c){e("Semantic",`unknown column '${r.v}'`,r);return null}return c};
 for(const s of flat){switch(s.type){
 case "data":if(data){e("Semantic","only one data block is allowed",s);break}
  data=s;let tn=0;
  for(const c of s.cols){if(!["numeric","categorical","binary"].includes(c.ty))e("Type",`unknown type '${c.ty}' (use numeric, categorical or binary)`,{l:c.tl,c:c.tc});
   if(C[c.name])e("Semantic",`duplicate column '${c.name}'`,c);C[c.name]=c;if(c.role=="target"){tn++;tgt=c}}
  if(tn!=1)e("Semantic","data block needs exactly one target column",s);else task=tgt.ty=="numeric"?"regression":"classification";break;
 case "split":if(!data)e("Semantic","declare a data block first",s);if(sp)e("Semantic","duplicate split",s);
  if(Math.abs(s.train+s.test-1)>1e-6)e("Semantic",`split fractions must sum to 1 (got ${+(s.train+s.test).toFixed(4)})`,s);sp=s;break;
 case "require":if(s.what=="missing")need(s.col,s.col);else if(s.what!="rows")e("Semantic",`unknown metric '${s.what}' (use rows or missing(col))`,s);
  else if(!data)e("Semantic","declare a data block first",s);gates.push(s);break;
 case "scale":case "encode":case "impute":{const c=need(s.col,s.col);if(!c)break;
  if(c.role=="target"){e("Leakage",`'${s.type} ${c.name}' transforms the target; label information leaks into the features`,s.col);break}
  if(c.role=="id"){e("Type",`'${c.name}' is an id column, not a feature`,s.col);break}
  if(!sp)e("Leakage",`'${s.type} ${c.name}' would be fitted before split; test-set statistics leak into training. Move it after 'split'`,s);
  const ok={scale:["standard","minmax"],encode:["onehot","ordinal"],impute:["mean","median","mode"]}[s.type];
  if(!ok.includes(s.method.v))e("Semantic",`unknown ${s.type} method '${s.method.v}' (use ${ok.join(", ")})`,s.method);
  if(s.type=="scale"&&c.ty!="numeric")e("Type",`cannot scale ${c.ty} column '${c.name}'`,s.col);
  if(s.type=="encode"&&c.ty=="numeric")e("Type",`cannot encode numeric column '${c.name}'; use scale`,s.col);
  if(s.type=="impute"&&c.ty!="numeric"&&s.method.v!="mode")e("Type",`'${s.method.v}' needs a numeric column; use 'mode' for '${c.name}'`,s.method);
  tf.push({t:s.type,col:c.name,m:s.method.v});break}
 case "model":{const A=ALG[s.algo.v];if(M[s.name])e("Semantic",`duplicate model '${s.name}'`,s);
  if(!A)e("Semantic",`unknown algorithm '${s.algo.v}' (use ${Object.keys(ALG).join(", ")})`,s.algo);
  else if(task&&!A[task])e("Type",`'${s.algo.v}' cannot solve a ${task} task (target '${tgt.name}' is ${tgt.ty})`,s.algo);
  M[s.name]={algo:s.algo.v,args:s.args};break}
 case "train":if(!M[s.model.v])e("Semantic",`unknown model '${s.model.v}'`,s.model);
  else if(!sp)e("Semantic","train must come after split",s);else tr.push(s.model.v);break;
 case "evaluate":if(!tr.length)e("Semantic","evaluate needs a trained model above it",s);
  for(const m of s.metrics){if(task&&!METRICS[task].includes(m.v))e("Type",`metric '${m.v}' is invalid for ${task} (use ${METRICS[task].join(", ")})`,m);
   else if(m.v=="auc"&&tgt.ty!="binary")e("Type","auc needs a binary target",m);ev.push(m.v)}break}}
 if(!data)e("Semantic","pipeline has no data block",ast.body[0]||{l:1,c:1});
 else{if(!sp)warns.push({kind:"Warning",msg:"no split declared",l:ast.body[0].l,c:ast.body[0].c});
  if(!Object.values(C).some(c=>c.role=="feature"))e("Semantic","no feature columns declared",data);
  for(const c of Object.values(C))if(c.role=="feature"&&c.ty=="categorical"&&!tf.some(t=>t.col==c.name&&t.t=="encode"))warns.push({kind:"Warning",msg:`categorical feature '${c.name}' is not encoded`,l:c.l,c:c.c});
  for(const n in M)if(!tr.includes(n))warns.push({kind:"Warning",msg:`model '${n}' is never trained`,l:data.l,c:data.c})}
 return{errs,warns,P:{data,C,task,sp,M,tr:[...new Set(tr)],tf,gates,ev,flat,tgt}}}

/* ============ CODE GENERATOR (scikit-learn) ============ */
const py=a=>a.t=="STR"?JSON.stringify(a.v):a.t=="ID"?({true:"True",false:"False",none:"None"}[a.v]??JSON.stringify(a.v)):a.v;
function gen(ast,P){const L=[],feats=Object.values(P.C).filter(c=>c.role=="feature").map(c=>c.name),cls=P.task=="classification",imp=new Set();
 for(const n in P.M){const[c,m]=ALG[P.M[n].algo][P.task];imp.add(`from sklearn.${m} import ${c}`)}
 L.push(`# Generated by MLPipe Studio from pipeline '${ast.name}'`,"# Leakage-safe: every transformer is fitted on the TRAIN split only.",
 "import pandas as pd","from sklearn.model_selection import train_test_split","from sklearn.pipeline import Pipeline","from sklearn.compose import ColumnTransformer",
 "from sklearn.impute import SimpleImputer","from sklearn.preprocessing import StandardScaler, MinMaxScaler, OneHotEncoder, OrdinalEncoder","from sklearn import metrics",...imp,"",
 `df = pd.read_csv(${JSON.stringify(P.data.path)})`,"","# ---- quality gates (require) ----");
 for(const g of P.gates){const ex=g.what=="rows"?"len(df)":`df[${JSON.stringify(g.col.v)}].isna().mean()`,txt=g.what=="rows"?"rows":`missing(${g.col.v})`;
  L.push(`assert ${ex} ${g.op} ${g.val}, "quality gate failed: ${txt} ${g.op} ${g.val}"`)}
 const sp=P.sp||{train:.8,test:.2};
 L.push("",`X = df[${JSON.stringify(feats)}]`,`y = df[${JSON.stringify(P.tgt.name)}]`,
 `X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=${sp.test}, random_state=${sp.seed??0})`,"","# ---- preprocessing (unrolled for-loops included) ----");
 const by={};P.tf.forEach(t=>(by[t.col]??=[]).push(t));const ents=[];
 for(const c in by){const st=by[c].map((t,i)=>{const m=t.m;const o=t.t=="impute"?`SimpleImputer(strategy=${JSON.stringify(m=="mode"?"most_frequent":m)})`:
  t.t=="scale"?(m=="minmax"?"MinMaxScaler()":"StandardScaler()"):(m=="onehot"?'OneHotEncoder(handle_unknown="ignore")':'OrdinalEncoder(handle_unknown="use_encoded_value", unknown_value=-1)');
  return `(${JSON.stringify(t.t+i)}, ${o})`});
  ents.push(`    (${JSON.stringify(c)}, Pipeline([${st.join(", ")}]), [${JSON.stringify(c)}])`)}
 const rest=feats.filter(f=>!by[f]);if(rest.length)ents.push(`    ("passthrough", "passthrough", ${JSON.stringify(rest)})`);
 L.push("preprocess = ColumnTransformer([",ents.join(",\n"),"])","","# ---- models ----","models = {");
 for(const n in P.M){const[c]=ALG[P.M[n].algo][P.task];L.push(`    ${JSON.stringify(n)}: ${c}(${P.M[n].args.map(a=>a.k+"="+py(a)).join(", ")}),`)}
 L.push("}","",`results = {}`,`for name in ${JSON.stringify(P.tr)}:`,`    pipe = Pipeline([("prep", preprocess), ("model", models[name])])`,
 "    pipe.fit(X_train, y_train)   # fit on train only","    pred = pipe.predict(X_test)","    results[name] = {");
 const avg=P.tgt.ty=="binary"?'"binary"':'"macro"',MX={accuracy:"metrics.accuracy_score(y_test, pred)",f1:`metrics.f1_score(y_test, pred, average=${avg})`,precision:`metrics.precision_score(y_test, pred, average=${avg})`,recall:`metrics.recall_score(y_test, pred, average=${avg})`,auc:"metrics.roc_auc_score(y_test, pipe.predict_proba(X_test)[:, 1])",rmse:"metrics.mean_squared_error(y_test, pred) ** 0.5",mae:"metrics.mean_absolute_error(y_test, pred)",r2:"metrics.r2_score(y_test, pred)"};
 for(const m of [...new Set(P.ev)])L.push(`        ${JSON.stringify(m)}: ${MX[m]},`);
 L.push("    }","","for name, r in results.items():","    print(name, {k: round(v, 4) for k, v in r.items()})","");return L.join("\n")}

/* ============ GRAMMAR ============ */
const GRAMMAR=`program   := 'pipeline' IDENT '{' stmt* '}'
stmt      := data | split | require | transform | for | model | train | evaluate
data      := 'data' STRING '{' column+ '}'
column    := ('feature' | 'target' | 'id') IDENT ':' TYPE      TYPE = numeric | categorical | binary
split     := 'split' NUMBER NUMBER ['seed' NUMBER]              train and test fractions
require   := 'require' ('rows' | 'missing' '(' IDENT ')') CMP NUMBER   CMP = < <= > >= ==
transform := ('scale' | 'encode' | 'impute') IDENT METHOD
for       := 'for' IDENT 'in' '[' IDENT (',' IDENT)* ']' '{' stmt* '}'   (unrolled at compile time)
model     := 'model' IDENT '=' ALGO '(' [IDENT '=' VALUE (',' IDENT '=' VALUE)*] ')'
train     := 'train' IDENT
evaluate  := 'evaluate' IDENT (',' IDENT)*
comment   := '#' ... end of line

Compiler phases
  1 Lexer  ->  2 Parser (AST)  ->  3 Loop unrolling  ->  4 Semantic + type check
  ->  5 Leakage analysis  ->  6 scikit-learn code generation

Leakage rules (compile errors)
  L1  fit-transform (scale / encode / impute) before 'split'
  L2  transforming the target column
  Type rules: scale needs numeric, encode needs categorical/binary, id columns are never features,
  models and metrics must match the task (classification vs regression).`;

/* ============ UI ============ */
const $=id=>document.getElementById(id),ta=$("ta"),esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const files={...SAMPLES};let cur="churn.mlp",tab="Problems",R=null;
const TABS=["Problems","Output","Tokens","AST","Python","Grammar"];
function build(){const src=ta.value;files[cur]=src;R={errs:[],warns:[],tokens:[],ast:null,py:null,P:null};
 try{R.tokens=lex(src);R.ast=parse(R.tokens);const a=analyze(R.ast);R.errs=a.errs;R.warns=a.warns;R.P=a.P;
  if(!a.errs.length)R.py=gen(R.ast,a.P)}catch(x){if(x.kind)R.errs=[x];else throw x}
 draw()}
function draw(){const n=R.errs.length;
 $("tabs").innerHTML=TABS.map(t=>`<div class="${t==tab?"on":""}" data-t="${t}">${t}${t=="Problems"&&n?`<span class="badge">${n}</span>`:""}</div>`).join("");
 $("st").textContent=n?`✖ ${n} error(s)`:`✔ build ok${R.warns.length?" · "+R.warns.length+" warning(s)":""}`;
 const bad=new Set(R.errs.map(e=>e.l));
 $("gut").innerHTML=ta.value.split("\n").map((_,i)=>bad.has(i+1)?`<span class="e">${i+1}</span>`:i+1).join("\n");
 const p=$("panel");
 if(tab=="Problems"){const all=[...R.errs,...R.warns];p.innerHTML=all.length?all.map(e=>`<div class="prob ${e.kind=="Warning"?"w":e.kind}" data-l="${e.l}" data-c="${e.c}"><i>${e.kind=="Warning"?"⚠":"✖"} ${e.kind}</i> ${esc(e.msg)} <s>${cur} [${e.l}:${e.c}]</s></div>`).join(""):`<span class="ok">✔ No problems. All compiler phases passed.</span>`}
 else if(tab=="Output"){const P=R.P,ok=!n;
  p.innerHTML=`<div class="stg">${R.tokens.length?"✔":"✖"} Lexer: ${R.tokens.length} tokens</div><div class="stg">${R.ast?"✔":"✖"} Parser: AST built${R.ast?" ("+R.ast.body.length+" top-level statements)":""}</div>`+
  (R.ast?`<div class="stg">✔ Loop unrolling: ${P?P.flat.length:0} flat statements</div><div class="stg">${ok?"✔":"✖"} Semantic / type check: ${n} error(s), ${R.warns.length} warning(s)</div><div class="stg">${R.errs.some(e=>e.kind=="Leakage")?"✖ Leakage analysis: LEAK DETECTED":ok?"✔ Leakage analysis: no leakage":"· Leakage analysis: see Problems"}</div>`:"")+
  (ok?`<div class="stg">✔ Codegen: ${R.py.split("\n").length} lines of scikit-learn Python</div><br><b>Pipeline plan</b><pre>${esc(`read ${P.data.path}  ->  quality gates (${P.gates.length})  ->  split ${P.sp?P.sp.train+"/"+P.sp.test:"-"}\n  ->  fit transforms on TRAIN: ${P.tf.map(t=>t.t+" "+t.col).join(", ")||"none"}\n  ->  train: ${P.tr.join(", ")}  ->  evaluate: ${[...new Set(P.ev)].join(", ")}   (${P.task})`)}</pre><br><span style="color:var(--mute)">Run the generated Python (Python tab) with your CSV to get real metrics.</span>`:`<br><span style="color:var(--err)">Build failed. Fix the problems and run again.</span>`)}
 else if(tab=="Tokens")p.innerHTML=R.tokens.length?`<table><tr><th>pos</th><th>kind</th><th>value</th></tr>${R.tokens.map(t=>`<tr><td>${t.l}:${t.c}</td><td>${t.k}</td><td>${esc(t.v)}</td></tr>`).join("")}</table>`:"No tokens (lexical error).";
 else if(tab=="AST")p.innerHTML=R.ast?`<pre>${esc(JSON.stringify(R.ast,(k,v)=>["l","c","tl","tc"].includes(k)?undefined:v,2))}</pre>`:"No AST (syntax error).";
 else if(tab=="Python")p.innerHTML=R.py?`<button class="ghost cp" id="cp">Copy</button><pre>${esc(R.py)}</pre>`:"Code is generated only when the program compiles without errors.";
 else p.innerHTML=`<pre>${esc(GRAMMAR)}</pre>`;
 const cp=$("cp");if(cp)cp.onclick=()=>navigator.clipboard.writeText(R.py).then(()=>cp.textContent="Copied")}
function pos(){const b=ta.value.slice(0,ta.selectionStart).split("\n");$("pos").textContent=`Ln ${b.length}, Col ${b[b.length-1].length+1}   MLPipe   UTF-8`}
function open(f){files[cur]=ta.value;cur=f;ta.value=files[f];$("fname").textContent=f;
 $("files").innerHTML=Object.keys(files).map(k=>`<div class="f ${k==f?"on":""}" data-f="${k}">▫ ${k}</div>`).join("");build();pos()}
$("files").onclick=e=>e.target.dataset.f&&open(e.target.dataset.f);
$("tabs").onclick=e=>{if(e.target.dataset.t){tab=e.target.dataset.t;draw()}};
$("panel").onclick=e=>{const d=e.target.closest(".prob");if(!d)return;const l=+d.dataset.l,c=+d.dataset.c,L=ta.value.split("\n");
 let o=0;for(let i=0;i<l-1;i++)o+=L[i].length+1;ta.focus();ta.setSelectionRange(o+c-1,o+c-1)};
let tm;ta.addEventListener("input",()=>{clearTimeout(tm);tm=setTimeout(build,250)});
ta.addEventListener("scroll",()=>$("gut").scrollTop=ta.scrollTop);
["keyup","click"].forEach(v=>ta.addEventListener(v,pos));
ta.addEventListener("keydown",e=>{if(e.ctrlKey&&e.key=="Enter"||e.metaKey&&e.key=="Enter"){e.preventDefault();build();tab=R.errs.length?"Problems":"Output";draw()}
 if(e.key=="Tab"){e.preventDefault();document.execCommand("insertText",false,"  ")}});
$("run").onclick=()=>{build();tab=R.errs.length?"Problems":"Output";draw()};
$("theme").onclick=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme=="dark"?"":"dark"};
open("churn.mlp");
</script>
</body>
</html>
